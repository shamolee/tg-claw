# tg-claw configuration
# Copy this file to config.yaml and fill in your values.
#   cp config.example.yaml config.yaml

# Language: en / ko / az / ru / tr (see src/resources/lang/)
lang: "en"

# Windows scheduled task name (used by win-scripts/*.ps1, default tg-claw)
service_name: "tg-claw"

# Runtime files location (logs/ locks/ state/ uploads/). Relative to this file
storage_dir: "storage"

# Days to keep images/files received via Telegram (0 = keep forever)
upload_retention_days: 7

# Telegram chat ID (the user who talks to the bot)
chat_id: "YOUR_TELEGRAM_CHAT_ID"

# Allowed user IDs (comma-separated; if empty, only chat_id is allowed)
# You can find your ID with @userinfobot
allowed_users: ""

# Per-project settings
# Each project runs as its own Telegram bot.
# Create a bot with @BotFather and enter its token.
projects:
  MyProject:
    cwd: "/path/to/your/project"          # Claude Code working directory
    bot_token: "BOT_TOKEN_FROM_BOTFATHER"  # Telegram bot token (issued by @BotFather)
