[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-claw"
version = "0.1.0"
description = "Telegram-based remote control for Claude Code sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shamo Humbatli" },
    { name = "gbongk" },  # original TeleClaw author
]
keywords = ["claude-code", "telegram", "agent", "tg-claw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "claude-code-sdk>=0.0.20",
    "httpx>=0.27",
    "anyio>=4.0",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/shamolee/tg-claw"
Repository = "https://github.com/shamolee/tg-claw"
Issues = "https://github.com/shamolee/tg-claw/issues"

[project.scripts]
tg-claw = "src:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
